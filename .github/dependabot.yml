version: 2

updates:
  # Workflow actions are pinned to commit SHAs; Dependabot rewrites the SHA and
  # its trailing version comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

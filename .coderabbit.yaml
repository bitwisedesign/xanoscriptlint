# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Org defaults: https://github.com/bitwisedesign/coderabbit/blob/main/.coderabbit.yaml
inheritance: true


tone_instructions: "You must talk like a highly skilled TypeScript and Node.js engineer who builds open source developer tooling, and who knows static analysis, linter design, and XanoScript well enough to judge whether a rule is worth its false positives."

reviews:
  path_instructions:
    - path: "**"
      instructions: |
        This repository is `xanoscriptlint`: a command-line style and convention
        linter for XanoScript, written in TypeScript and distributed as an ESM
        Node.js package. It is pre-1.0 and has never been published to npm, so
        it has no installed users.

        Do NOT flag concerns about backward compatibility, deprecation paths, or
        migration guides for changes to rule ids, rule defaults, the
        `.xanoscriptlint.yml` schema, CLI flag names, reporter output, or exit
        codes. Breaking any of those is currently free and expected. Omit these
        concerns from all reviews until this instruction is removed.

        Scope guards for v0.1, which are deliberate and should not be reported as
        gaps: there is no autofix (`--fix`), no nested/inherited config files, no
        plugin loader for JavaScript rules (custom rules are regex-only), and no
        dependency on the official `@xano/xanoscript-language-server` or any
        parser. Rules operate on raw source text plus line helpers. Suggesting a
        real parser as a future direction is fine; flagging its absence as a
        defect is not.

        This repository runs its own linters in CI and they gate every pull
        request: ESLint with type-aware typescript-eslint rules
        (`npm run lint:ts`, config in `eslint.config.mjs`) and markdownlint-cli2
        (`npm run lint:md`, config in `.markdownlint.yaml`). Both of CodeRabbit's
        equivalent built-in tools are deliberately disabled.

        Do NOT duplicate that work. Skip comments about formatting, indentation,
        quote style, semicolons, import ordering, line length, unused variables,
        `any` usage, floating promises, Markdown heading or list style, and
        anything else those two linters already decide. If a rule is off in
        `eslint.config.mjs` or `.markdownlint.yaml`, that is an intentional
        project decision, not an oversight to re-report in review.

        Spend the review on what a linter cannot see: correctness, false
        positives in lint rules, unhandled edge cases, incorrect or missing
        tests, and documentation that contradicts the code.
    - path: "src/**/*.ts"
      instructions: |
        TypeScript, ESM only, targeting Node.js >= 20 with no bundler and no
        transpile step beyond `tsc`.

        Relative imports intentionally carry a `.js` extension (for example
        `./types.js` from `types.ts`) because the package uses Node's ESM
        resolution. This is correct and required; never suggest dropping the
        extension or switching to `.ts`.

        Runtime dependencies are deliberately minimal (`commander`, `picomatch`,
        `yaml`). Weigh any new runtime dependency against writing a few lines
        directly, and say so explicitly if you propose one.
    - path: "src/rules/*.ts"
      instructions: |
        Each file here is a single lint rule exporting a `Rule` (see
        `src/rules/types.ts`): `id`, `description`, `defaultEnabled`,
        `defaultSeverity`, and a pure `lint(file, options)` that returns
        `Violation[]` and performs no I/O.

        Review priorities, in order:
        - False positives. A default-enabled rule that fires on valid XanoScript
          is worse than a missing rule. Probe the regex or line scan against
          comments, string literals, and nested blocks, and describe a concrete
          input that would misfire.
        - `defaultEnabled: true` is reserved for rules that are near-universally
          correct. Anything stylistic or opinionated must be opt-in
          (`defaultEnabled: false`).
        - Rule ids are lowercase snake_case and must match the source filename.
        - Reported `line` is 1-based and `column` is 1-based.

        A new or renamed rule must arrive with its `src/rules/index.ts`
        registration, a `test/fixtures/**` sample, a case in `test/rules.test.ts`,
        and a `docs/rules.md` entry. Flag the PR if any of those are missing.
    - path: "test/**/*.ts"
      instructions: |
        Tests use the built-in `node:test` runner and `node:assert/strict`; there
        is no Jest, Vitest, or Mocha here, so do not suggest their APIs. Tests
        that touch the filesystem must use the temp-directory helpers in
        `test/support.ts` rather than writing into the repository.
    - path: "test/fixtures/**"
      instructions: |
        These are deliberately crafted XanoScript samples whose exact bytes are
        the test contract. Files under `violations/` are supposed to be wrong,
        and several fixtures intentionally have no trailing newline at
        end-of-file (`.gitattributes` marks them `-text` to stop Git normalizing
        them).

        Do NOT comment on missing newline at EOF, line endings, formatting,
        indentation, or XanoScript style anywhere in this directory, and never
        suggest "fixing" a fixture. Only flag a fixture when it no longer
        exercises the rule its test claims it does.
    - path: "**/*.xs"
      instructions: |
        Every `.xs` file in this repository is a test fixture, not a real Xano
        object. Unlike a Xano workspace repository, these files are never pushed
        to or pulled from Xano, so they legitimately have no `guid`, no
        `canonical`, and no `swagger` token. Do NOT post review comments about
        those fields being absent.

        XanoScript comments start with `//` and must occupy their own line;
        trailing same-line comments are not valid. Never suggest moving a comment
        onto the end of a code line.
    - path: "docs/*.md"
      instructions: |
        `docs/rules.md` is the rule catalog and `docs/configuration.md` is the
        `.xanoscriptlint.yml` reference. Both are user-facing contracts: verify
        that documented rule ids, default-enabled state, default severities, and
        config keys match what the code in `src/` actually does, and flag any
        drift.
    - path: "{README.md,CONTRIBUTING.md,CHANGELOG.md}"
      instructions: |
        User-facing project documentation. Check that documented CLI flags,
        commands, and rule behavior match `src/cli.ts` and `src/rules/`.

        House style: do not introduce comparisons to other linters by name, and
        do not use the word "footgun".
    - path: ".github/workflows/*.yml"
      instructions: |
        CI runs the test suite across a matrix of Ubuntu and macOS on the
        supported Node.js versions. Any change to the supported Node range must
        stay consistent with the `engines` field in `package.json`.
  path_filters:
    - "!package-lock.json"
    - "!dist/**"
    - "!.cursor/plans/**"
    - "**/*"     # include everything else
  pre_merge_checks:
    custom_checks:
      - name: "rule-change-completeness"
        instructions: |
          Scan all changed files in this PR.
          If the PR adds, removes, or renames a rule file under `src/rules/` (excluding
          `index.ts` and `types.ts`), then all of the following MUST change in the same PR:
          - `src/rules/index.ts`, so the rule is registered in or removed from `builtinRules`.
          - `docs/rules.md`, so the catalog lists the rule with its id, default-enabled
            state, and default severity.
          - `test/rules.test.ts` plus a fixture under `test/fixtures/`, so the rule has at
            least one violating case and one clean case.
          If the PR changes an existing rule's `id`, `defaultEnabled`, or `defaultSeverity`,
          `docs/rules.md` MUST be updated to match.
          When any of these are missing, block the PR and name exactly which rule and which
          artifact is out of sync.
    docstrings:
      mode: "warning"
  tools:
    markdownlint:
      enabled: false
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
  slop_detection:
    enabled: true
chat:
  allow_non_org_members: true
knowledge_base:
  automatic_repository_linking: true
  code_guidelines:
    enabled: true
    filePatterns: ['CONTRIBUTING.md', 'docs/*.md']

